services:
  export:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - export_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  export_data:
