global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: services
    static_configs:
      - targets: ['search:3000']
        labels:
          service: search-svc
      - targets: ['audit:3000']
        labels:
          service: audit-svc
      - targets: ['export:3000']
        labels:
          service: export-svc
