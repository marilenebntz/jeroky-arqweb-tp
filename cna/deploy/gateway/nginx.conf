events {}

http {
    server_tokens off;

    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
    }

    log_format correlated '$remote_addr "$request" $status '
                          'request_id=$correlation_id '
                          'upstream=$upstream_addr '
                          'duration=$request_time';

    access_log /dev/stdout correlated;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        add_header X-Request-ID $correlation_id always;
        add_header X-Content-Type-Options nosniff always;

        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_intercept_errors on;
        proxy_hide_header X-Content-Type-Options;

        error_page 502 503 504 =503 @unavailable;

        location @unavailable {
            default_type application/json;
            return 503 '{"error":"Servicio no disponible","request_id":"$correlation_id"}';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /v2/search {
            set $destination http://search:3000;
            proxy_pass $destination$request_uri;
        }

        location = /v2/audit {
            set $destination http://audit:3000;
            proxy_pass $destination$request_uri;
        }

        location = /v2/exports {
            set $destination http://export:3000;
            proxy_pass $destination$request_uri;
        }

        location ^~ /v2/exports/ {
            set $destination http://export:3000;
            proxy_pass $destination$request_uri;
        }

        location /v2/ {
            default_type application/json;
            return 404 '{"error":"Ruta inexistente"}';
        }

        location /api/ {
            set $destination http://backend:3001;
            proxy_pass $destination$request_uri;
        }

        location / {
            set $destination http://frontend:3000;
            proxy_pass $destination$request_uri;
        }
    }
}
