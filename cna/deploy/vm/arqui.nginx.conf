    server_tokens off;

    limit_req_zone $binary_remote_addr zone=arqui_api_limit:10m rate=5r/s;
    limit_req_status 429;

    map $http_x_request_id $arqui_correlation_id {
        default $request_id;
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
    }

    log_format arqui_correlated '$remote_addr "$request" $status '
                          'request_id=$arqui_correlation_id '
                          'upstream=$upstream_addr '
                          'duration=$request_time';

    access_log /var/log/nginx/arqui-access.log arqui_correlated;
    error_log /var/log/nginx/arqui-error.log warn;


    server {
        listen 80;
        server_name arqui.local;
        return 301 https://arqui.local$request_uri;
    }

    server {
        listen 443 ssl;
        server_name arqui.local;

        ssl_certificate /etc/nginx/certs/arqui/arqui.crt;
        ssl_certificate_key /etc/nginx/certs/arqui/arqui.key;
        ssl_protocols TLSv1.3;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Request-ID $arqui_correlation_id always;
        add_header X-Content-Type-Options nosniff always;

        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $arqui_correlation_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_intercept_errors on;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Request-ID;

        error_page 502 503 504 =503 @unavailable;
        error_page 429 =429 @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-Request-ID $arqui_correlation_id always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"error":"Demasiadas solicitudes","request_id":"$arqui_correlation_id"}';
        }

        location @unavailable {
            default_type application/json;
            return 503 '{"error":"Servicio no disponible","request_id":"$arqui_correlation_id"}';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /v2/search {
            limit_req zone=arqui_api_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3103;
        }

        location = /v2/audit {
            limit_req zone=arqui_api_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3102;
        }

        location = /v2/exports {
            limit_req zone=arqui_api_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3104;
        }

        location ^~ /v2/exports/ {
            limit_req zone=arqui_api_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3104;
        }

        location /v2/ {
            default_type application/json;
            return 404 '{"error":"Ruta inexistente"}';
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3101;
        }

        location / {
            proxy_pass http://127.0.0.1:3100;
        }
    }
