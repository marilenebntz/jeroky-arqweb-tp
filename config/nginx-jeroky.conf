# /etc/nginx/sites-available/jeroky
# Configuración vigente al cierre del Hito 3.
# HTTP redirige a HTTPS y Nginx actúa como proxy inverso del frontend.

server {
    listen 80;
    server_name 192.168.0.17 jeroky.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.0.17 jeroky.local;

    ssl_certificate /home/arqweb/jeroky/certs/jeroky.crt;
    ssl_certificate_key /home/arqweb/jeroky/certs/jeroky.key;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
